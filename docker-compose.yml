services:
  web:
    build: .
    # Override entrypoint for local dev — skip collectstatic, use Django's
    # auto-reloading dev server instead of Daphne.
    entrypoint: []
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      # Mount source so code changes are reflected without rebuilding
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
