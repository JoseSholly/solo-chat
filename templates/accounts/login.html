{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — ChatRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="auth-brand-name">ChatRooms</span>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Log in to your account</p>

      <form class="auth-form" id="login-form" novalidate>
        <div id="form-error" class="form-error"></div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="password"
                   placeholder="your password" autocomplete="current-password" required
                   style="padding-right:42px;">
            <button type="button" id="toggle-password"
                    aria-label="Toggle password visibility"
                    style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--text-muted);display:flex;align-items:center;">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="submit-btn">
          Log in
        </button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/signup/">Sign up</a></p>
    </div>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script>
    if (localStorage.getItem('cr_access')) {
      window.location.replace(new URLSearchParams(window.location.search).get('next') || '/dashboard/');
    }

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eye-icon');
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
           <circle cx="12" cy="12" r="3"/>`;
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById('form-error');
      errorEl.classList.remove('visible');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const result = await authLogin({
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });

      if (result.ok) {
        const next = new URLSearchParams(window.location.search).get('next') || '/dashboard/';
        window.location.href = next;
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Log in';

      const errors = result.errors;
      const msg = typeof errors === 'string'
        ? errors
        : errors?.non_field_errors?.[0] || errors?.email?.[0] || 'Invalid credentials.';
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    });
  </script>
</body>
</html>
