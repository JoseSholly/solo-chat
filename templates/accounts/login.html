{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — ChatRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="auth-brand-name">ChatRooms</span>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Log in to your account</p>

      <form class="auth-form" id="login-form" novalidate>
        <div id="form-error" class="form-error"></div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password"
                 placeholder="your password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary btn-full" type="submit" id="submit-btn">
          Log in
        </button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/signup/">Sign up</a></p>
    </div>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script>
    if (localStorage.getItem('cr_access')) {
      window.location.replace(new URLSearchParams(window.location.search).get('next') || '/dashboard/');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorEl = document.getElementById('form-error');
      errorEl.classList.remove('visible');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      const result = await authLogin({
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });

      if (result.ok) {
        const next = new URLSearchParams(window.location.search).get('next') || '/dashboard/';
        window.location.href = next;
        return;
      }

      btn.disabled = false;
      btn.textContent = 'Log in';

      const errors = result.errors;
      const msg = typeof errors === 'string'
        ? errors
        : errors?.non_field_errors?.[0] || errors?.email?.[0] || 'Invalid credentials.';
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    });
  </script>
</body>
</html>
