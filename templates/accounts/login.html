{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230a0a0b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%238fe0ae%27/%3E%3C/svg%3E">
  <title>Sign in — Solo-Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% include "partials/pwa.html" %}
</head>
<body>
  <div class="auth">
    <main class="auth-main">
      <div class="auth-top">
        <a class="wordmark" href="/"><span class="wordmark-mark"></span>Solo-Chat</a>
        <p class="auth-top-link">New here? <a class="link" id="alt-link" href="/signup/">Create an account</a></p>
      </div>

      <div class="auth-body">
        <h1 class="auth-title">Welcome back.</h1>
        <p class="auth-sub">Sign in to get back to your rooms.</p>

        <form class="auth-form" id="login-form" novalidate>
          <div id="form-error" class="form-error" role="alert"></div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" autocomplete="email" required autofocus>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" autocomplete="current-password" required>
              <button type="button" class="icon-btn input-affix" id="toggle-password"
                      aria-label="Show password" aria-pressed="false"></button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-full" type="submit" id="submit-btn">Sign in</button>
        </form>
      </div>
    </main>

    <aside class="auth-aside" aria-hidden="true">
      <p class="auth-aside-line">Private rooms.</p>
      <p class="auth-aside-line">Real conversations.</p>
      <p class="auth-aside-line is-live">Live.<span class="live-dot is-breathing"></span></p>
      <p class="auth-aside-foot">Rooms are invite-only. Messages, voice notes and presence arrive the moment they happen.</p>
    </aside>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script>
    const next = new URLSearchParams(window.location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard/';

    if (localStorage.getItem('cr_access')) window.location.replace(safeNext);
    if (next) document.getElementById('alt-link').href = '/signup/?next=' + encodeURIComponent(next);

    const toggle = document.getElementById('toggle-password');
    const pw     = document.getElementById('password');
    toggle.innerHTML = icon('eye', 18);
    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      toggle.innerHTML = icon(show ? 'eyeOff' : 'eye', 18);
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(show));
    });

    document.querySelectorAll('.input').forEach((el) =>
      el.addEventListener('input', () => el.removeAttribute('aria-invalid')));

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      errorEl.classList.remove('is-visible');

      const email = document.getElementById('email');
      if (!email.value.trim() || !pw.value) {
        const missing = !email.value.trim() ? email : pw;
        missing.setAttribute('aria-invalid', 'true');
        errorEl.textContent = 'Enter your email and password.';
        errorEl.classList.add('is-visible');
        missing.focus();
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const result = await authLogin({ email: email.value.trim(), password: pw.value });
      if (result.ok) { window.location.href = safeNext; return; }

      btn.disabled = false;
      btn.textContent = 'Sign in';

      const errors = result.errors;
      errorEl.textContent = typeof errors === 'string'
        ? errors
        : errors?.non_field_errors?.[0] || errors?.email?.[0] || 'Invalid email or password.';
      errorEl.classList.add('is-visible');
      pw.select();
    });
  </script>
</body>
</html>
