{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — ChatRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <nav class="navbar">
    <a class="navbar-brand" href="/dashboard/">
      <div class="navbar-brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <span class="navbar-brand-name">ChatRooms</span>
    </a>
    <div class="navbar-spacer"></div>
    <div class="user-menu">
      <button class="user-menu-trigger" id="user-menu-trigger">
        <div class="user-avatar" id="nav-user-avatar"></div>
        <span class="user-display-name" id="nav-user-name"></span>
        <span class="chevron">▾</span>
      </button>
      <div class="dropdown-menu" id="user-dropdown">
        <button class="dropdown-item danger" id="btn-logout">Log out</button>
      </div>
    </div>
  </nav>

  <div style="padding-top:var(--nav-h)">
    <div style="max-width:560px;margin:36px auto;padding:0 20px">

      <a href="/dashboard/" style="display:inline-flex;align-items:center;gap:6px;
         color:var(--text-secondary);font-size:13px;margin-bottom:24px;text-decoration:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back to Dashboard
      </a>

      <div style="background:var(--surface);border:1px solid var(--border);
                  border-radius:var(--radius);padding:32px">

        <!-- Avatar + name row -->
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:32px;
                    padding-bottom:24px;border-bottom:1px solid var(--border)">

          <div id="profile-avatar-wrap" title="Click to change photo"
               style="position:relative;cursor:pointer;flex-shrink:0">
            <div class="user-avatar" id="profile-avatar"
                 style="width:72px;height:72px;font-size:26px;font-weight:700;border-radius:var(--radius-sm)"></div>
            <div style="position:absolute;bottom:-4px;right:-4px;
                        width:22px;height:22px;
                        background:var(--accent);border-radius:var(--radius-full);
                        display:flex;align-items:center;justify-content:center;
                        border:2px solid var(--surface)">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none">
          </div>

          <div style="min-width:0;flex:1">
            <div id="view-display-name" style="font-size:20px;font-weight:700;"></div>
            <div id="view-username"     style="font-size:13px;color:var(--text-secondary);margin-top:3px;"></div>
          </div>

          <button class="btn btn-ghost" id="btn-edit" style="flex-shrink:0">Edit Profile</button>
        </div>

        <!-- View mode -->
        <div id="view-mode">
          <div style="display:flex;flex-direction:column;gap:20px">

            <div>
              <div style="font-size:11px;font-weight:600;letter-spacing:.08em;
                          color:var(--text-muted);margin-bottom:6px">BIO</div>
              <div id="view-bio" style="color:var(--text-secondary);line-height:1.6"></div>
            </div>

            <div>
              <div style="font-size:11px;font-weight:600;letter-spacing:.08em;
                          color:var(--text-muted);margin-bottom:6px">EMAIL</div>
              <div id="view-email"></div>
            </div>

            <div>
              <div style="font-size:11px;font-weight:600;letter-spacing:.08em;
                          color:var(--text-muted);margin-bottom:6px">MEMBER SINCE</div>
              <div id="view-joined" style="color:var(--text-secondary)"></div>
            </div>

          </div>
        </div>

        <!-- Edit mode -->
        <div id="edit-mode" class="hidden">
          <div style="display:flex;flex-direction:column;gap:18px">

            <div id="profile-error" class="form-error"></div>

            <div class="form-group">
              <label class="form-label" for="edit-display-name">Display Name</label>
              <input class="form-input" type="text" id="edit-display-name"
                     placeholder="Your name" autocomplete="off">
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-bio">Bio</label>
              <textarea class="form-input" id="edit-bio" rows="3"
                        placeholder="Tell people about yourself…"></textarea>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px">
              <button class="btn btn-ghost"   id="btn-cancel">Cancel</button>
              <button class="btn btn-primary" id="btn-save">Save</button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth-guard.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/profile.js' %}"></script>
</body>
</html>
