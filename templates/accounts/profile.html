{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230a0a0b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%238fe0ae%27/%3E%3C/svg%3E">
  <title>Profile — Solo-Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="page">
    <header class="page-bar">
      <a href="/dashboard/" class="page-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Rooms
      </a>
      <a class="wordmark" href="/dashboard/"><span class="wordmark-mark"></span>Solo-Chat</a>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-logout">Log out</button>
    </header>

    <main class="profile">
      <section class="profile-identity">
        <button type="button" class="profile-avatar" id="profile-avatar-wrap" aria-label="Change profile photo">
          <span id="profile-avatar"></span>
          <span class="profile-avatar-overlay" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H18a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.25"/></svg>
            Change
          </span>
          <svg class="profile-avatar-ring" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="64" pathLength="100"/>
          </svg>
        </button>
        <input type="file" id="avatar-file-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>

        <div>
          <h1 class="profile-name" id="view-display-name"></h1>
          <p class="profile-handle" id="view-username"></p>
        </div>
      </section>

      <section class="profile-view" id="view-mode">
        <p class="profile-bio" id="view-bio"></p>
        <dl class="profile-facts">
          <div><dt>Email</dt><dd id="view-email"></dd></div>
          <div><dt>Member since</dt><dd id="view-joined"></dd></div>
        </dl>
        <button type="button" class="btn btn-secondary" id="btn-edit">Edit profile</button>
      </section>

      <form class="profile-edit" id="edit-mode" novalidate hidden>
        <div id="profile-error" class="form-error" role="alert"></div>
        <div class="field">
          <label class="field-label" for="edit-display-name">Name</label>
          <input class="input" type="text" id="edit-display-name" maxlength="100" autocomplete="name">
        </div>
        <div class="field">
          <label class="field-label" for="edit-bio">Bio <span class="field-hint" id="bio-count"></span></label>
          <textarea class="input" id="edit-bio" rows="4" placeholder="A line or two about you"></textarea>
        </div>
        <div class="profile-edit-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
        </div>
      </form>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth-guard.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script src="{% static 'js/profile.js' %}"></script>
</body>
</html>
