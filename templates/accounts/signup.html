{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230a0a0b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%238fe0ae%27/%3E%3C/svg%3E">
  <title>Create an account — Solo-Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth">
    <main class="auth-main">
      <div class="auth-top">
        <a class="wordmark" href="/"><span class="wordmark-mark"></span>Solo-Chat</a>
        <p class="auth-top-link">Have an account? <a class="link" id="alt-link" href="/login/">Sign in</a></p>
      </div>

      <div class="auth-body">
        <h1 class="auth-title">Create your account.</h1>
        <p class="auth-sub">Then start a room, or join one you were invited to.</p>

        <form class="auth-form" id="signup-form" novalidate>
          <div id="form-error" class="form-error" role="alert"></div>

          <div class="field">
            <label class="field-label" for="display-name">Name</label>
            <input class="input" type="text" id="display-name" autocomplete="name" maxlength="100"
                   aria-describedby="err-display-name" required autofocus>
            <span class="field-error" id="err-display-name"></span>
          </div>

          <div class="field">
            <label class="field-label" for="username">Username <span class="field-hint">Letters, numbers and _</span></label>
            <input class="input mono" type="text" id="username" autocomplete="username" maxlength="50"
                   autocapitalize="none" spellcheck="false" aria-describedby="err-username" required>
            <span class="field-error" id="err-username"></span>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" autocomplete="email" aria-describedby="err-email" required>
            <span class="field-error" id="err-email"></span>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password <span class="field-hint">At least 8 characters</span></label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" autocomplete="new-password"
                     aria-describedby="err-password" required>
              <button type="button" class="icon-btn input-affix" id="toggle-password"
                      aria-label="Show password" aria-pressed="false"></button>
            </div>
            <span class="field-error" id="err-password"></span>
          </div>

          <button class="btn btn-primary btn-lg btn-full" type="submit" id="submit-btn">Create account</button>
        </form>
      </div>
    </main>

    <aside class="auth-aside" aria-hidden="true">
      <p class="auth-aside-line">Private rooms.</p>
      <p class="auth-aside-line">Real conversations.</p>
      <p class="auth-aside-line is-live">Live.<span class="live-dot is-breathing"></span></p>
      <p class="auth-aside-foot">Create a room, share its link, and talk in text, images and voice notes.</p>
    </aside>
  </div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script>
    const next = new URLSearchParams(window.location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/dashboard/';

    if (localStorage.getItem('cr_access')) window.location.replace(safeNext);
    if (next) document.getElementById('alt-link').href = '/login/?next=' + encodeURIComponent(next);

    const FIELD_MAP = {
      display_name: 'display-name',
      username:     'username',
      email:        'email',
      password:     'password',
    };

    const toggle = document.getElementById('toggle-password');
    const pw     = document.getElementById('password');
    toggle.innerHTML = icon('eye', 18);
    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      toggle.innerHTML = icon(show ? 'eyeOff' : 'eye', 18);
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.setAttribute('aria-pressed', String(show));
    });

    function setFieldError(domId, msg) {
      document.getElementById('err-' + domId).textContent = msg || '';
      const input = document.getElementById(domId);
      if (msg) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
    }

    function clearErrors() {
      document.getElementById('form-error').classList.remove('is-visible');
      Object.values(FIELD_MAP).forEach(id => setFieldError(id, ''));
    }

    Object.values(FIELD_MAP).forEach((id) =>
      document.getElementById(id).addEventListener('input', () => setFieldError(id, '')));

    // Catch the obvious things before a round trip
    function validate(v) {
      const errs = {};
      if (!v.displayName) errs['display-name'] = 'Tell people what to call you.';
      if (!v.username) errs.username = 'Pick a username.';
      else if (!/^[A-Za-z0-9_]+$/.test(v.username)) errs.username = 'Use only letters, numbers and underscores.';
      if (!v.email) errs.email = 'Enter your email.';
      else if (!/^\S+@\S+\.\S+$/.test(v.email)) errs.email = 'That doesn\'t look like an email address.';
      if (v.password.length < 8) errs.password = 'Use at least 8 characters.';
      return errs;
    }

    function showServerErrors(errors) {
      let handled = false;
      for (const [field, domId] of Object.entries(FIELD_MAP)) {
        if (errors[field]) {
          setFieldError(domId, Array.isArray(errors[field]) ? errors[field][0] : errors[field]);
          handled = true;
        }
      }
      if (!handled) {
        const el = document.getElementById('form-error');
        el.textContent = errors.non_field_errors?.[0] || 'Something went wrong. Please try again.';
        el.classList.add('is-visible');
      }
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const values = {
        displayName: document.getElementById('display-name').value.trim(),
        username:    document.getElementById('username').value.trim(),
        email:       document.getElementById('email').value.trim(),
        password:    pw.value,
      };
      const errs = validate(values);
      const ids = Object.keys(errs);
      if (ids.length) {
        ids.forEach(id => setFieldError(id, errs[id]));
        document.getElementById(ids[0]).focus();
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      const result = await authSignup(values);
      if (result.ok) { window.location.href = safeNext; return; }

      btn.disabled = false;
      btn.textContent = 'Create account';

      if (typeof result.errors === 'string') {
        const el = document.getElementById('form-error');
        el.textContent = result.errors;
        el.classList.add('is-visible');
      } else {
        showServerErrors(result.errors || {});
        document.querySelector('.input[aria-invalid="true"]')?.focus();
      }
    });
  </script>
</body>
</html>
