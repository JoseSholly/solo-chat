{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230a0a0b%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%238fe0ae%27/%3E%3C/svg%3E">
  <title>You're invited — Solo-Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% include "partials/pwa.html" %}
</head>
<body>
  <div class="page">
    <header class="page-bar">
      <a href="/dashboard/" class="page-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Rooms
      </a>
      <a class="wordmark" href="/dashboard/"><span class="wordmark-mark"></span>Solo-Chat</a>
      <span></span>
    </header>

    <main class="join" id="join-card" aria-live="polite">
      <div class="spinner" aria-label="Loading invite"></div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/auth-guard.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script>
    function slugFromPath() {
      // URL shape: /join/<slug>/
      return window.location.pathname.split('/').filter(Boolean)[1] || null;
    }

    function renderError(msg) {
      document.title = 'Invite not found — Solo-Chat';
      document.getElementById('join-card').innerHTML = `
        <p class="kicker">Invite link</p>
        <h1 class="join-name">This link doesn't<br>open a room.</h1>
        <p class="join-desc">${escHtml(msg)}</p>
        <div class="join-actions">
          <a href="/dashboard/" class="btn btn-primary btn-lg">Go to your rooms</a>
        </div>`;
    }

    async function init() {
      const slug = slugFromPath();
      if (!slug) { renderError('There\'s no invite code in this address.'); return; }

      const res = await apiFetch(`/api/invite/${slug}/`);
      if (!res.ok) {
        renderError('It may have been mistyped, or the room was deleted. Ask whoever sent it for a fresh link.');
        return;
      }

      const room = await res.json();

      // Already a member: go straight to the room
      if (room.is_member) {
        window.location.replace(`/dashboard/?room=${room.slug}`);
        return;
      }

      document.title = `Join ${room.name} — Solo-Chat`;
      const n = room.member_count;
      document.getElementById('join-card').innerHTML = `
        <p class="kicker"><span class="live-dot"></span>You've been invited to</p>
        ${monogramHtml(room.name, 'xl')}
        <div>
          <h1 class="join-name">${escHtml(room.name)}</h1>
          ${room.description ? `<p class="join-desc">${escHtml(room.description)}</p>` : ''}
          <p class="join-meta">${n} member${n !== 1 ? 's' : ''} · private room</p>
        </div>
        <div class="join-actions">
          <button type="button" class="btn btn-primary btn-lg" id="btn-join">Join room ${icon('arrowRight', 18)}</button>
          <a href="/dashboard/" class="btn btn-ghost btn-lg">Not now</a>
        </div>
        <div id="join-error" class="form-error" role="alert"></div>`;

      const btn = document.getElementById('btn-join');
      btn.focus();
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Joining…';

        const joinRes = await apiFetch(`/api/invite/${slug}/join/`, { method: 'POST' });
        if (!joinRes.ok) {
          const d = await joinRes.json().catch(() => ({}));
          const errEl = document.getElementById('join-error');
          errEl.textContent = d.error || 'Couldn\'t join the room. Please try again.';
          errEl.classList.add('is-visible');
          btn.disabled = false;
          btn.innerHTML = `Join room ${icon('arrowRight', 18)}`;
          return;
        }
        window.location.href = `/dashboard/?room=${room.slug}`;
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
